[project]
name = "tpj-boxhead"
version = "0.1.0"
description = "Pygame survival shooter with endless rounds, augments and permanent upgrades."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pygame>=2.6.1,<3"]

[project.scripts]
boxhead = "boxhead.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boxhead"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "boxhead/data"
