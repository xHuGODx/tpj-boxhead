name: Funcionalidade
description: Definir uma alteração com comportamento verificável.
labels: [enhancement]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objetivo e comportamento esperado
      description: Explicar o que o jogador deve conseguir fazer.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceitação
      description: Usar uma checklist com resultados observáveis.
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: Arquitetura e validação
      description: Responsabilidades, padrões justificados e cenários a verificar.
  - type: textarea
    id: dependencies
    attributes:
      label: Dependências
      description: Referenciar issues necessárias.
